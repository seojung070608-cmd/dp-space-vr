<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A-Frame Space Planets</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script>
      AFRAME.registerComponent("starfield", {
        init: function () {
          var group = document.createElement("a-entity");
          for (var i = 0; i < 700; i += 1) {
            var star = document.createElement("a-sphere");
            var radius = 160;
            var phi = Math.random() * Math.PI * 2;
            var costheta = Math.random() * 2 - 1;
            var theta = Math.acos(costheta);
            var x = radius * Math.sin(theta) * Math.cos(phi);
            var y = radius * Math.sin(theta) * Math.sin(phi);
            var z = radius * Math.cos(theta);

            star.setAttribute("position", x + " " + y + " " + z);
            star.setAttribute("radius", 0.06 + Math.random() * 0.06);
            star.setAttribute("color", "#ffffff");
            star.setAttribute("material", "shader: flat; emissive: #ffffff; emissiveIntensity: 1;");
            group.appendChild(star);
          }
          this.el.appendChild(group);
        },
      });

      // ============================================================
      // [초대형 핵폭발, 전역 연소, 아이언맨 마크 5 출동 & 얼음 소화 시스템]
      // ============================================================
      AFRAME.registerComponent("nuke-trigger", {
        init: function () {
          var el = this.el;
          window.isNukeDetonating = false;

          // 마우스 호버 커서 피드백
          el.addEventListener("mouseenter", function () {
            if (!window.isNukeDetonating) {
              document.body.style.cursor = "pointer";
              el.setAttribute("scale", "1.2 1.2 1.2");
            }
          });
          el.addEventListener("mouseleave", function () {
            document.body.style.cursor = "default";
            if (!window.isNukeDetonating) {
              el.setAttribute("scale", "1 1 1");
            }
          });

          // 코어 구체 클릭 이벤트 -> 초대형 핵폭발 발동!
          el.addEventListener("click", function () {
            if (window.isNukeDetonating) return;
            window.isNukeDetonating = true;
            document.body.style.cursor = "default";

            playNuclearSound();
            triggerNuclearChainReaction(function () {
              window.isNukeDetonating = false;
            });
          });
        },
      });

      // 브라우저 내장 Web Audio API로 웅장한 핵폭발 굉음 & 제트/냉기 사운드
      function playNuclearSound() {
        try {
          var AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return;
          var ctx = new AudioCtx();
          if (ctx.state === "suspended") ctx.resume();

          // 1. 초대형 핵폭발 파열음
          var bufferSize = ctx.sampleRate * 4;
          var buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
          var data = buffer.getChannelData(0);
          for (var i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
          }

          var noise = ctx.createBufferSource();
          noise.buffer = buffer;
          var filter = ctx.createBiquadFilter();
          filter.type = "lowpass";
          filter.frequency.setValueAtTime(1000, ctx.currentTime);
          filter.frequency.exponentialRampToValueAtTime(30, ctx.currentTime + 3.8);

          var gain = ctx.createGain();
          gain.gain.setValueAtTime(2.2, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 4.0);

          noise.connect(filter);
          filter.connect(gain);
          gain.connect(ctx.destination);
          noise.start();

          // 2. 깊은 서브우퍼 지진 진동
          var osc = ctx.createOscillator();
          var oscGain = ctx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(140, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(20, ctx.currentTime + 3.0);

          oscGain.gain.setValueAtTime(1.5, ctx.currentTime);
          oscGain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 3.5);

          osc.connect(oscGain);
          oscGain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 3.6);
        } catch (e) {
          console.log("Audio not supported or blocked", e);
        }
      }

      // 초대형 핵폭발 ➡️ 전역 연소 ➡️ 아이언맨 마크 5 출격 & 얼음 소화 시퀀스
      function triggerNuclearChainReaction(onComplete) {
        var fxContainer = document.getElementById("nuke-fx-container");
        var flash = document.getElementById("nuke-flash");
        var fireball = document.getElementById("nuke-fireball");
        var shock1 = document.getElementById("nuke-shockwave-1");
        var shock2 = document.getElementById("nuke-shockwave-2");
        var nukeLight = document.getElementById("nuke-light");
        var ironman = document.getElementById("ironman-mark5");
        var iceSpray = document.getElementById("ironman-ice-spray");
        var targets = document.querySelectorAll(".destructible-object");
        var fireAuras = document.querySelectorAll(".fire-aura");

        // [Phase 1] 초대형 핵폭발 발동 (0s)
        fxContainer.setAttribute("visible", "true");

        // 기존 잔여 애니메이션 초기화 (무한 재클릭 보장)
        var resetAnim = function(elem) {
          Array.from(elem.attributes).forEach(function(attr) {
            if (attr.name.startsWith("animation")) elem.removeAttribute(attr.name);
          });
        };
        resetAnim(flash);
        resetAnim(fireball);
        resetAnim(shock1);
        resetAnim(shock2);
        resetAnim(nukeLight);
        resetAnim(ironman);

        // 눈부신 초신성 플래시 (직경 400m)
        flash.setAttribute("scale", "1 1 1");
        flash.setAttribute("material", "opacity", "1");
        flash.setAttribute("animation__flash", "property: scale; from: 1 1 1; to: 420 420 420; dur: 500; easing: easeOutQuad;");
        flash.setAttribute("animation__fade", "property: material.opacity; from: 1; to: 0; dur: 750; delay: 200; easing: easeOutQuad;");

        // 초대형 마그마 핵 파이어볼 (직경 220m로 초대형 팽창!)
        fireball.setAttribute("scale", "1 1 1");
        fireball.setAttribute("material", "opacity", "0.95");
        fireball.setAttribute("animation__fire", "property: scale; from: 1 1 1; to: 220 220 220; dur: 2200; easing: easeOutExpo;");
        fireball.setAttribute("animation__firefade", "property: material.opacity; from: 0.95; to: 0; dur: 2500; delay: 1800; easing: easeInQuad;");

        // 충격파 링 초대형 확장
        shock1.setAttribute("scale", "1 1 1");
        shock1.setAttribute("material", "opacity", "1");
        shock1.setAttribute("animation__shock1", "property: scale; from: 1 1 1; to: 260 260 260; dur: 1900; easing: easeOutExpo;");
        shock1.setAttribute("animation__sfade1", "property: material.opacity; from: 1; to: 0; dur: 1900; easing: easeOutQuad;");

        shock2.setAttribute("scale", "1 1 1");
        shock2.setAttribute("material", "opacity", "1");
        shock2.setAttribute("animation__shock2", "property: scale; from: 1 1 1; to: 240 240 240; dur: 2400; delay: 150; easing: easeOutExpo;");
        shock2.setAttribute("animation__sfade2", "property: material.opacity; from: 1; to: 0; dur: 2400; delay: 150; easing: easeOutQuad;");

        // 폭발 조명
        nukeLight.setAttribute("light", "intensity", "35");
        nukeLight.setAttribute("animation__light", "property: light.intensity; from: 35; to: 0; dur: 4500; easing: easeOutQuad;");

        // [Phase 2] 모든 회전 물체가 화염에 휩싸여 맹렬히 불타오름! (0.3s)
        setTimeout(function () {
          fireAuras.forEach(function (aura) {
            aura.setAttribute("visible", "true");
          });
          targets.forEach(function (obj) {
            obj.setAttribute("animation__burnshake", "property: position; from: 0 0 0; to: 0.5 -0.5 0.5; dir: alternate; dur: 90; loop: true;");
          });
        }, 300);

        // [Phase 3] 아이언맨 마크 5 급강하 출격! (2.2s)
        setTimeout(function () {
          ironman.setAttribute("visible", "true");
          ironman.setAttribute("position", "70 60 -110");
          ironman.setAttribute("rotation", "30 -40 15");
          // 초음속으로 씬 중심 상공으로 날아와 호버링
          ironman.setAttribute("animation__flyin", "property: position; from: 70 60 -110; to: 0 8 -22; dur: 1500; easing: easeOutCubic;");
          ironman.setAttribute("animation__rotin", "property: rotation; from: 30 -40 15; to: 10 -15 0; dur: 1500; easing: easeOutCubic;");
        }, 2200);

        // [Phase 4] 아이언맨의 초강력 극저온 얼음 분사 소화 시작! (3.8s)
        setTimeout(function () {
          // 양손에서 얼음 냉기 빔 방출
          iceSpray.setAttribute("visible", "true");
          iceSpray.setAttribute("animation__spray", "property: scale; from: 0.2 0.2 0.2; to: 35 35 35; dur: 1600; easing: easeOutQuad;");

          // 물체들의 불길이 식고 소화됨
          setTimeout(function () {
            fireAuras.forEach(function (aura) {
              aura.setAttribute("visible", "false");
            });
            targets.forEach(function (obj) {
              obj.removeAttribute("animation__burnshake");
              obj.setAttribute("animation__coolrestore", "property: scale; from: 0.95 0.95 0.95; to: 1 1 1; dur: 800; easing: easeOutBack;");
            });
          }, 1200);
        }, 3800);

        // [Phase 5] 소화 완료 ➡️ 아이언맨 초음속 퇴장 & 완전한 평화 복구 (5.8s)
        setTimeout(function () {
          iceSpray.setAttribute("visible", "false");
          // 아이언맨이 턴하여 우주 밖으로 고속 비행 퇴장!
          ironman.setAttribute("animation__flyout", "property: position; from: 0 8 -22; to: -110 80 90; dur: 1600; easing: easeInCubic;");
          ironman.setAttribute("animation__rotout", "property: rotation; from: 10 -15 0; to: -45 120 30; dur: 1600; easing: easeInCubic;");

          // [Phase 6] 완전 리셋 및 재클릭 대기 완료 (7.6s)
          setTimeout(function () {
            ironman.setAttribute("visible", "false");
            ironman.removeAttribute("animation__flyin");
            ironman.removeAttribute("animation__rotin");
            ironman.removeAttribute("animation__flyout");
            ironman.removeAttribute("animation__rotout");
            fxContainer.setAttribute("visible", "false");

            targets.forEach(function (obj) {
              obj.removeAttribute("animation__coolrestore");
              obj.setAttribute("scale", "1 1 1");
            });

            var core = document.getElementById("ufo-core");
            if (core) {
              core.setAttribute("scale", "1 1 1");
            }

            // 지속적으로 계속해서 누를 수 있도록 플래그 완전 리셋!
            if (onComplete) onComplete();
          }, 1800);
        }, 5800);
      }
    </script>

      html,
      body {

            <a-entity id="nuke-light" light="type: point; color: #ff5500; intensity: 0; distance: 220"></a-entity>
          </a-entity>

          <!-- 3. 중앙 개구부에서 출격하여 앞으로 나아가는 소형 편대 우주선들 -->
          <a-entity class="destructible-object">
            <!-- 편대 1 -->
            <a-entity
              animation="property: position; from: 0 0 0; to: -15 8 50; dur: 4500; loop: true; easing: easeOutQuad;"
              animation__fade="property: scale; from: 0.1 0.1 0.1; to: 1.2 1.2 1.2; dur: 1000; easing: linear;"
            >
              <a-cone radius-bottom="0.7" radius-top="0.05" height="2.2" rotation="90 0 0" material="color: #334155; metalness: 0.8; roughness: 0.3;"></a-cone>
              <a-box position="0 0 -0.4" width="2.4" height="0.1" depth="1.2" material="color: #1e293b; metalness: 0.7; roughness: 0.3;"></a-box>
              <!-- 푸른 추진 엔진 플레임 -->
              <a-sphere position="0 0 -1.2" radius="0.4" material="color: #00f5ff; shader: flat; emissive: #00f5ff; emissiveIntensity: 1;"></a-sphere>
            </a-entity>

            <!-- 편대 2 -->
            <a-entity
              animation="property: position; from: 0 0 0; to: 18 -6 55; dur: 5200; delay: 1200; loop: true; easing: easeOutQuad;"
              animation__fade="property: scale; from: 0.1 0.1 0.1; to: 1.1 1.1 1.1; dur: 1000; easing: linear;"
            >
              <a-cone radius-bottom="0.6" radius-top="0.05" height="2" rotation="90 0 0" material="color: #334155; metalness: 0.8; roughness: 0.3;"></a-cone>
              <a-box position="0 0 -0.3" width="2" height="0.1" depth="1" material="color: #1e293b; metalness: 0.7; roughness: 0.3;"></a-box>
              <a-sphere position="0 0 -1.1" radius="0.35" material="color: #00f5ff; shader: flat; emissive: #00f5ff; emissiveIntensity: 1;"></a-sphere>
            </a-entity>

            <!-- 편대 3 -->
            <a-entity
              animation="property: position; from: 0 0 0; to: -6 -12 60; dur: 4800; delay: 2400; loop: true; easing: easeOutQuad;"
              animation__fade="property: scale; from: 0.1 0.1 0.1; to: 1.3 1.3 1.3; dur: 1000; easing: linear;"
            >
              <a-cone radius-bottom="0.8" radius-top="0.05" height="2.5" rotation="90 0 0" material="color: #334155; metalness: 0.8; roughness: 0.3;"></a-cone>
              <a-box position="0 0 -0.5" width="2.8" height="0.1" depth="1.4" material="color: #1e293b; metalness: 0.7; roughness: 0.3;"></a-box>
              <a-sphere position="0 0 -1.4" radius="0.45" material="color: #00f5ff; shader: flat; emissive: #00f5ff; emissiveIntensity: 1;"></a-sphere>
            </a-entity>
          </a-entity>
        </a-entity>
      </a-entity>

      <a-entity id="camera-rig" position="0 1.6 0">
        <!-- 마우스 클릭 및 VR 시선 커서 지원 레이캐스터 -->
        <a-camera position="0 0 0" cursor="rayOrigin: mouse" raycaster="objects: .clickable"></a-camera>

        <!-- 1. 거대한 자개빛 토성 (지름 22m의 압도적 크기 + 영롱한 토성 고리) -->
        <a-entity
          class="destructible-object"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 45000; easing: linear;"
        >
          <a-entity position="26 3 0">
            <!-- 불타는 화염 오라 (핵폭발 시 활성화) -->
            <a-sphere
              class="fire-aura"
              visible="false"
              radius="12.8"
              material="color: #ff4500; shader: flat; emissive: #ff2200; emissiveIntensity: 1; transparent: true; opacity: 0.72; side: double;"
            ></a-sphere>

            <!-- 거대한 자개빛 본체 -->
            <a-sphere
              radius="11"
              color="#fdf4ff"
              material="metalness: 0.75; roughness: 0.16; emissive: #a5f3fc; emissiveIntensity: 0.25;"
              animation="property: rotation; to: 0 360 0; loop: true; dur: 22000; easing: linear;"
              animation__color="property: material.color; type: color; from: #fdf4ff; to: #fce7f3; dir: alternate; dur: 4000; loop: true; easing: easeInOutSine;"
              animation__emissive="property: material.emissive; type: color; from: #a5f3fc; to: #ddd6fe; dir: alternate; dur: 3000; loop: true; easing: easeInOutSine;"
            ></a-sphere>

            <!-- 토성 고리 (영롱한 자개빛 링) -->
            <a-ring
              radius-inner="13.5"
              radius-outer="20.5"
              rotation="68 25 0"
              material="color: #fdf2f8; side: double; opacity: 0.65; metalness: 0.8; roughness: 0.2; transparent: true; emissive: #bae6fd; emissiveIntensity: 0.22;"
            ></a-ring>
          </a-entity>
        </a-entity>

        <!-- 2. 은은한 소라빛 행성 -->
        <a-entity
          class="destructible-object"
          rotation="14 0 0"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 7000; easing: linear;"
        >
          <!-- 불타는 화염 오라 -->
          <a-sphere
            class="fire-aura"
            visible="false"
            position="4.2 -0.1 0"
            radius="0.9"
            material="color: #ff4500; shader: flat; emissive: #ff2200; emissiveIntensity: 1; transparent: true; opacity: 0.75; side: double;"
          ></a-sphere>

          <a-sphere
            position="4.2 -0.1 0"
            radius="0.55"
            color="#a0c4e2"
            material="metalness: 0.3; roughness: 0.38; emissive: #7fb3d5; emissiveIntensity: 0.18;"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 3000; easing: linear;"
          ></a-sphere>
        </a-entity>

        <!-- 3. 영롱한 분홍색 행성 -->
        <a-entity
          class="destructible-object"
          rotation="-10 0 0"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 10200; easing: linear;"
        >
          <!-- 불타는 화염 오라 -->
          <a-sphere
            class="fire-aura"
            visible="false"
            position="5.8 0.35 0"
            radius="0.8"
            material="color: #ff4500; shader: flat; emissive: #ff2200; emissiveIntensity: 1; transparent: true; opacity: 0.75; side: double;"
          ></a-sphere>

          <a-sphere
            position="5.8 0.35 0"
            radius="0.45"
            color="#ff70a6"
            material="metalness: 0.45; roughness: 0.22; emissive: #f43f5e; emissiveIntensity: 0.26;"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 3800; easing: linear;"
            animation__color="property: material.color; type: color; from: #ff70a6; to: #ffa3c2; dir: alternate; dur: 2800; loop: true; easing: easeInOutSine;"
          ></a-sphere>
        </a-entity>
      </a-entity>
    </a-scene>
  </body>
</html>
